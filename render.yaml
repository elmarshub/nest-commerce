services:
  - type: web
    name: nest-commerce-api
    runtime: node
    plan: free
    # Same US East region as Vercel's default functions (iad1) and Neon's us-east-1
    region: virginia
    rootDir: api
    # NODE_ENV=production is also set at build time, so dev deps (nest CLI, tsc-alias) must be forced in
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Paste the existing Railway values so current logins keep working
      # (use generateValue: true instead for brand-new secrets)
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: "900"
      - key: FRONTEND_URL
        value: https://havens.martinelmars.com
      # comma-separated; the vercel.app URL stays allowed so the old link keeps working
      - key: ALLOWED_ORIGINS
        value: https://havens.martinelmars.com,https://havens-commerce.vercel.app
      # Secrets below are prompted for in the dashboard on first Blueprint sync
      - key: DATABASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
